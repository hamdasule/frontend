<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');
*{margin: 0;padding: 0;}
.container{
    width: 1600px;
    height: 830px;
    /* border: 1px solid black; */
    margin: 0 auto;
}

.container h1 {
    font-family: "Noto Serif", serif;
    /* background-color: aqua; */
    text-align: center;
    margin-top: 30px;
    font-size: 44px;
}
.p1{
    text-align: center;
    margin-bottom: 23px;
}
.section1{
    width: 1600px;
    height: 500px;
    /* background-color: bisque; */
    overflow: hidden;
    padding-left: 45px;

}
.section1 .box{
    width: 340px;
    height: 430px;
    border: 1px solid #333;
    /* background-color: aquamarine; */
    float: left;
    margin-left: 30px;
    margin-top: 20px;
    box-sizing: border-box;
}
.section1 .box:last-child{
    margin-right: 5px;
}

.fbox{
    text-align: center;
}
.box img{
    width: 97px;
    height: 100px;
    /* background-color: brown; */
    margin-top: 50px;
    margin-left: 122px;
}
.num1{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #003e73;
    color: white;
    margin-left: 151px;
    margin-top: 25px;
    text-align: center;
    line-height: 40px;
}
h3{
    text-align: center;
    font-size: 20px;
    margin-top: 20px;
    margin-bottom: 9px;
    color: #003e73;
}
.p2{
    text-align: center;
    color: #1E1E1E;
    line-height: 160%;
}
.p3{
    font-size: 20px;
    color: #003e73;
    margin-bottom: 25px;
}
a{
    text-decoration: none;
}
.p4 a{
    display: inline-block;
    padding: 18px 96px;
    background-color: #003e73;
    color: white;
}
.p4 a:hover{
    background-color: white;
    border: 1px solid #333;
    color: #003e73;
}

</style>

</head>
<body>
    <div class="container">
        <h1>Franchise</h1>
        <div class="p1"><p>브랜드창업을 검토하실 때 꼭 필요합니다</p></div>
        <section class="section1">

            <div class="box box1">
                <img src="images/franchise_ico1.png" alt="">
                <p class="num1">1</p>
                <p class="b1"></p>
                <h3>창업설명회 & 개별상담</h3>
                <p class="p2">가맹지원서 및 상권조사표 작성</p>
            </div>
             <div class="box box2">
                <img src="images/franchise_ico2.png" alt="">
                <p class="num1">2</p>
                <h3>타겟 입지</h3>
                <p class="p2">브랜드는 주로 메인상권 <br/> 지역에 개설됩니다.</p>
            </div>
            <div class="box box3">
                <img src="images/franchise_ico3.png" alt="">
                <p class="num1">3</p>
                <h3>필요 면적</h3>
                <p class="p2">브랜드는 지상1층, <br/>전용면적 최소 50m²(15PY)/ <br/>
                   지상2층, 전용면적 최소 66m²(20PY)의 <br/>공간이 필요합니다.</p>
            </div>
            <div class="box box4">
                <img src="images/franchise_ico4.png" alt="">
                <p class="num1">4</p>
                <h3>창업 가능 지역</h3>
                <p class="p2">전국 상권 진행 가능(제주제외), <br/> 상권 상담은 창업문의에 남겨주세요.</p>
            </div>
        </section>
        <div class="fbox">
        <div class="p3"><p>본사와 가맹점주가 상생할 수 있는
            <br/> 지속성 있는 <strong>브랜드의 개발과 경영방침</strong>을 추구합니다.
        </p></div>
        <div class="p4"><p><a href="#">창업설명회 신청/문의</a></p></div>
    </div>
    
    </div>
</body>
</html>
