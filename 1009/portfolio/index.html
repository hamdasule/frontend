<script>
const list = document.getElementById('slide');
const liList = list.querySelectorAll('li');
const total = liList.length; // 9
const visible = 4;          
const li_width = 230;

let num = 0;

for(let i=0; i<visible; i++){
    const clone = liList[i].cloneNode(true);
    list.appendChild(clone);
}

function moveSlide(direction){
    num += direction;
    list.style.transition = 'margin-left 0.5s';
    list.style.marginLeft = -li_width * num + 'px';
}

list.addEventListener('transitionend', () => {
    if(num >= total){
        list.style.transition = 'none';
        num = num - total; 
        list.style.marginLeft = -li_width * num + 'px';
    }
    if(num < 0){
        list.style.transition = 'none';
        num = total + num;
        list.style.marginLeft = -li_width * num + 'px';
    }
});

document.querySelector('.next').addEventListener('click', e => { e.preventDefault(); moveSlide(1); });
document.querySelector('.prev').addEventListener('click', e => { e.preventDefault(); moveSlide(-1); });

let interval = setInterval(()=> moveSlide(1), 3000);
const frame = document.getElementById('slider');
frame.addEventListener('mouseover', ()=> clearInterval(interval));
frame.addEventListener('mouseout', ()=> interval = setInterval(()=> moveSlide(1), 3000));
</script>
