<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruits">
  <li>🍎 사과</li>
  <li>🍌 바나나</li>
  <li>🍇 포도</li>
</ul>
</body>
</html>
<script>
    const first = document.querySelector("#fruits li");// li중 첫번째
    console.log(first.textContent);//사과
    console.log(first.nextElementSibling.textContent);//바나나
    const Second = first.nextElementSibling; //바나나(출력안했음)
    console.log(Second.nextElementSibling.textContent);//포도

    console.log(Second.previousElementSibling.textContent);//이전 -> 사과

    const list = document.getElementById('fruits');
    //부모는
    console.log("부모자식")
    console.log(list.parentElement.tagName);
    console.log(list.children.length); //3개 (리스트fruits)자식들의 갯수
    console.log(list.firstElementChild.textContent); //사과
    console.log(list.lastElementChild.textContent); //포도


    //nextElementSibling 속성은 현재 요소의 바로 다음 형제 요소를 반환합니다.
    //즉, 같은 부모 요소를 가지고 있는 형제 요소 중에서 현재 요소보다 바로 뒤에 있는 요소를 선택하는 데 사용

</script>
