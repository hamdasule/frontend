<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
    }
    header{
        width: 100%;
        height: 100px;
        background-color: blanchedalmond;
    }
    header .header_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    header .header_container .logo{
        width: 20%;
        height: 100px;
        background-color: darkgoldenrod;
    }
    header .header_container nav{
        width: 80%;
        height: 100px;
        background-color: darkred;
    }
    .slide{
        width: 1200px;
        height: 300px;
        margin: 0 auto;
        background-color: olivedrab;
    }
    .contents{
        width: 1200px;
        height: 200px;
        margin: 0 auto;
        display: flex;
    }

    .contents .notice{
        width: 33.33%;
        height: 200px;
        background-color: #888;
    }
    .contents .gallery{
        width: 33.33%;
        height: 200px;
        background-color: #777;
    }
    .contents .banner{
        width: 33.33%;
        height: 200px;
        background-color: #666;
    }
    footer{
        width: 100%;
        height: 100px;
        background-color: olive;
    }
    footer .footer_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    footer .footer_container .f_1{
        width: 75%;
        height: 100px;
    }
    footer .footer_container .f_1 .f_menu{
        width: 100%;
        height: 50px;
        background-color: yellow;
    }
    footer .footer_container .f_1 .f_copy{
        width: 100%;
        height: 50px;
        background-color: yellowgreen;
    }
    footer .footer_container .f_2{
        width: 25%;
        height: 100px;
        background-color: #333;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="header_container">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </div>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="notice"></div>
            <div class="gallery"></div>
            <div class="banner"></div>
        </div>

        <footer>
            <div class="footer_container">
                <div class="f_1">
                    <div class="f_menu"></div>
                    <div class="f_copy"></div>
                </div>
                <div class="f_2"></div>
            </div>
        </footer>
    </div>
</body>
</html>
