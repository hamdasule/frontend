<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
    }
    #main{
        width: 100%;
        height: calc(100vh - 120px);
        display: flex;
        background-color: #999;
    }
    #main aside{
        width: 200px;
        height: 100%;
        background-color: #888;
    }
    #main aside .logo{
        width: 100%;
        height: 15%;
        background-color: aqua;
    }
    #main aside nav{
        width: 100%;
        height: 85%;
        background-color: blue;
    }
    #main .contents{
        width: 400px;
        height: 100%;
        background-color: #777;
    }
    #main .contents .banner{
        width: 100%;
        height: 15%;
        background-color: green;
    }
    #main .contents .notice{
        width: 100%;
        height: 35%;
        background-color: greenyellow;
    }#main .contents .gallery{
        width: 100%;
        height: 35%;
        background-color: darkolivegreen;
    }#main .contents .link{
        width: 100%;
        height: 15%;
        background-color: darkcyan;
    }
    #main .sldie{
        width: calc(100% - 600px);
        height: 100%;
        background-color: bisque;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
        
    }
    footer .f_1{
        width: 200px;
        height: 120px;
        background-color: #222;
    }
    footer .f_2{
        width: calc(100% - 500px);
        height: 120px;
        background-color: #555;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: powderblue;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: darkblue;
    }
    footer .f_3{
        width: 300px;
        height: 120px;
        background-color: #333;
    }



</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <aside>
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </aside>

            <div class="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="link"></div>
            </div>

            <div class="slide"></div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            <div class="f_3"></div>
        </footer>
    </div>
</body>
</html>
