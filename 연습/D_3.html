<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    aside{
        width: 200px;
        height: 850px;
        background-color: #999;
    }
    aside .logo{
        width: 200px;
        height: 20%;
        background-color: aqua;
    }
    aside nav{
        width: 200px;
        height: 80%;
    }
    #main{
        width: calc(100% - 200px);
        height: 850px;
        background-color: #888;
    }
    #main .slide{
        width: 100%;
        height: 400px;
        background-color: blue;
    }
    #main .slide .link{
        width: 100px;
        height: 300px;
        background-color: #444;
        position: absolute;
        top: 0;
        right: 0;
    }
    #main .banner{
        width: 100%;
        height: 200px;
        background-color: skyblue;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        background-color: #777;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
        background-color: #555;
    }
    footer .f_1{
        width: 20%;
        height: 120px;
        background-color: green;
    }
    footer .f_2{
        width: 80%;
        height: 120px;
        background-color: darkolivegreen;
    }
    footer .f_2 .f_copy1{
        width: 100%;
        height: 60px;
        background-color: #222;
    }
    footer .f_2 .f_copy2{
        width: 100%;
        height: 60px;
        background-color: plum;
    }



</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>

        <div id="main">
            <div class="slide">
                <div class="link"></div>
            </div>

            <div class="banner"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_copy1"></div>
                <div class="f_copy2"></div>
                </div>
        </footer>
    </div>
    
</body>
</html>
