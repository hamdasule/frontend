<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style13.css">
    <script src="./js/jquery-1.12.3.js"></script>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div id="main">
            <div class="slide">
                <div class="link"></div>
                <ul class="slides">
                    <li><img src="images/slide28.jpg" alt=""></li>
                    <li><img src="images/slide29.jpg" alt=""></li>
                    <li><img src="images/slide30.jpg" alt=""></li>
                </ul>
            </div>

            <div class="banner"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_sns"></div>
        </footer>
    </div>
</body>
</html>
<script>
    $(function(){
        var s = 0;
        setInterval(function(){
            s++;
            if(s==3){s=0;}
            $('.slides li').eq(s).css('top','100%').animate({'top':0},600);
            $('.slides li').eq(s-1).css('top',0).animate({'top':'-100%'},600);
        },3000);
    });
</script>
