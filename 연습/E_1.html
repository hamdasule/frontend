<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style17.css">
    <script src="./js/jquery-1.12.3.js"></script>
<style>
    #wrap{
        width: 100%;
    }
    #main{
        width: 100%;
        height: calc(100vh - 120px);
        display: flex;
        background-color: #888;
    }
    #main .aside{
        width: 200px;
        height: 100%;
        background-color: #999;
    }
    #main .aside .logo{
        width: 200px;
        height: 10%;
        background-color: aqua;
    }
    #main .aside nav{
        width: 200px;
        height: 90%;
        background-color: blue;
    }
    #main .contents{
        width: 400px;
        height: 100%;
        background-color: #666;
    }
    #main .contents .banner{
        width: 400px;
        height: 15%;
        background-color: green;
    }
    #main .contents .notice{
        width: 400px;
        height: 35%;
        background-color: darkcyan;
    }
    #main .contents .gallery{
        width: 400px;
        height: 35%;
        background-color: darkkhaki;
    }
    #main .contents .link{
        width: 400px;
        height: 15%;
        background-color: darkolivegreen;
    }
    #main .slide{
        width: calc(100% - 600px);
        height: 100%;
        background-color: bisque;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
        background-color: #777;
    }
    footer .f_1{
        width: 20%;
        height: 120px;
        background-color: orange;
    }
    footer .f_2{
        width: 80%;
        height: 120px;
        background-color: #555;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: #222;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: paleturquoise;
    }

</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <div class="aside">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>   
            </div>

            <div class="contents">
                <div class="content banner"></div>
                <div class="content notice"></div>
                <div class="content gallery"></div>
                <div class="content link"></div>
            </div>

            <div class="slide"></div>
        </div>

            <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            </footer>
        </div> 
    
</body>
</html>
