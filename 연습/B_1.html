<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
        height: 700px;
    }
    header{
        width: 100%;
        height: 100px;
        background-color: palevioletred;
    }
    header .header_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    header .header_container .logo{
        width: 20%;
        height: 100px;
        background-color: beige;

    }
    header .header_container nav{
        width: 80%;
        height: 100px;
        background-color: burlywood;

    }
    .slide{
        width: 1200px;
        height: 300px;
        margin: 0 auto;
        background-color: #999;
    }
    .contents{
        width: 1200px;
        height: 200px;
        margin: 0 auto; 
        display: flex;
    }
    .contents .c1{
        width: 33.33%;
        height: 200px;
        background-color: #777;
    }
    .contents .c2{
        width: 33.33%;
        height: 200px;
        background-color: #333;
    }
    .contents .c3{
        width: 33.33%;
        height: 200px;
        background-color: #555;
    }
    footer{
        width: 100%;
        height: 100px;
        background-color: sandybrown;
    }
    footer .footer_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    footer .footer_container .f_1{
        width: 20%;
        height: 100px;
        background-color: #444;
    }
    footer .footer_container .f_2{
        width: 80%;
        height: 100px;
    }
    footer .footer_container .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: skyblue;
    }
    footer .footer_container .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: blueviolet;
    }


</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="header_container">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </div>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="c1">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
            <div class="c2"></div>
            <div class="c3"></div>
        </div>

        <footer>
            <div class="footer_container">
                <div class="f_1"></div>
                <div class="f_2">
                    <div class="f_menu"></div>
                    <div class="f_copy"></div>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
