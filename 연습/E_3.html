<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
    }
    #main{
        width: 100%;
        height: 800px;
        display: flex;
        background-color: #999;
    }
    #main aside{
        width: 200px;
        height: 800px;
        background-color: #888;
    }
    #main aside .logo{
        width: 100%;
        height: 100px;
        background-color: aqua;
    }
    #main aside .nav{
        width: 100%;
        height: 700px;
        background-color: blue;
    }
    #main .contents{
        width: 400px;
        height: 800px;
        background-color: #777;
    }
    #main .contents .banner{
        width: 100%;
        height: 20%;
        background-color: #666;
    }
    #main .contents .notice{
        width: 100%;
        height: 40%;
        background-color: #111;
    }
    #main .contents .banner{
        width: 100%;
        height: 40%;
        background-color: #555;
    }
    #main .sldie{
        width: calc(100% -600px);
        height: 800px;
        background-color: #444;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #333;
    }
    footer .f_logo{
        width: 20%;
        height: 100px;
        background-color: pink;
    }
    footer .f_copy{
        width: 60%;
        height: 100px;
        background-color: palevioletred;
    }
    footer .f_sns{
        width: 20%;
        height: 100px;
        background-color: darkorchid;
    }



</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <aside>
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </aside>

            <div class="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>

            <div class="slide"></div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_sns"></div>
        </footer>
    </div>
</body>
</html>
