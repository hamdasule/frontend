<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1200px;
        height: 700px;
        margin: 0 auto;
    }
    header{
        width: 100%;
        height: 100px;
        display: flex;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #777;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #666;
    }
    .slide{
        width: 100%;
        height: 300px;
        background-color: #555;
    }
    .contents{
        width: 100%;
        height: 200px;
        display: flex;
    }

    .contents .notice{
        width: 33.33%;
        height: 200px;
        background-color: #333;
    }
    .contents .gallery{
        width: 33.33%;
        height: 200px;
        background-color: #222;
    }
    .contents .shortcut{
        width: 33.33%;
        height: 200px;
        background-color: #111;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
    }
    footer .f_1{
        width: 80%;
        height: 100px;
    }
    footer .f_1 .f_menu{
        width: 100%;
        height: 50px;
        background-color: pink;
    }
    footer .f_1 .f_copy{
        width: 100%;
        height: 50px;
        background-color: hotpink;
    }
    footer .f_2{
        width: 20%;
        height: 100px;
        background-color: #ddd;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="notice"></div>
            <div class="gallery"></div>
            <div class="shortcut"></div>
        </div>
        <footer>
            <div class="f_1">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            <div class="f_2"></div>
        </footer>
    </div>
</body>
</html>
