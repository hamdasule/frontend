<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
       
    }
    header{
        width: 100%;
        height: 100px;
        background-color: aquamarine;
    }
    header .header_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    header .header_container .logo{
        width: 20%;
        height: 100px;
        background-color: skyblue;
    }
    header .header_container nav{
        width: 80%;
        height: 100px;
        background-color: rgb(81, 81, 206);
    }
    .slide{
        width: 1200px;
        height: 300px;
        margin: 0 auto;
        background-color: #999;
    }
    .contents{
        width: 1200px;
        height: 200px;
        margin: 0 auto;
        display: flex;
    }
    .contents .notice{
        width: 33.33%;
        height: 200px;
        background-color: #777;
    }
    .contents .gallery{
        width: 33.33%;
        height: 200px;
        background-color: #666;
    }
    .contents .banner{
        width: 33.33%;
        height: 200px;
        background-color: #555;
    }
    footer{
        width: 100%;
        height: 100px;
        background-color: #aaa;
    }
    footer .footer_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    footer .footer_container .f_logo{
        width: 20%;
        height: 100px;
        background-color: #444;
    }
    footer .footer_container .f_copy{
        width: 60%;
        height: 100px;
        background-color: #333;
    }
    footer .footer_container .f_sns{
        width: 20%;
        height: 100px;
        background-color: #222;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="header_container">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </div>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="notice"></div>
            <div class="gallery"></div>
            <div class="banner"></div>
        </div>

        <footer>
            <div class="footer_container">
                <div class="f_logo"></div>
                <div class="f_copy"></div>
                <div class="f_sns"></div>
            </div>
        </footer>

    
    </div>
</body>
</html>
