<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style2.css">
    <script src="./js/jquery-1.12.3.js"></script>


</head>
<body>
    <div id="wrap">

        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide">
            <ul class="slides">
                <li><a href="#"><img src="images/slide4.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/slide5.jpg" alt=""></a></li>
                <li><a href="#"><img src="images/slide6.JPG" alt=""></a></li>
            </ul>
        </div>

        <div class="contents">
            <div class="notice">
                <h1>공지사항</h1>
                <table>
                    <tr>
                        <td>발달장애인 사회적 자립지원사업 '아트블룸(Artbloom)'</td><td>2019.05.21</td>
                    </tr>
                    <tr>
                        <td>미얀마 성장발달보고서 및 사업장소식 발송 안내</td><td>2019.04.20</td>
                    </tr>
                    <tr>
                        <td>네팔 성장발달보고서 및 사업장소식 발송 안내</td><td>2019.03.23</td>
                    </tr>
                    <tr>
                        <td>KB국민카드, 밀알복지재단에 장애청소년 후원금 1억 5천...</td><td>2019.02.25</td>
                    </tr>
                </table>
            </div>
            <div class="gallery">
                <h1>갤러리</h1>
                <ul>
                    <li><a href="#"><img src="images/g4.png" alt=""></a></li>
                    <li><a href="#"><img src="images/g5.png" alt=""></a></li>
                    <li><a href="#"><img src="images/g6.png" alt=""></a></li>
                </ul>
                
            </div>
            <div class="banner">
                <ul>
                    <li><img src="images/b1.png" alt=""></li>
                    <li><img src="images/b2.png" alt=""></li>
                    <li><img src="images/b3.png" alt=""></li>
                </ul>
            </div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_family"></div>
        </footer>
    </div>
    
</body>
</html>
<script>
    $(function(){

        var s =0;
        setInterval(function(){
        s++;
        if(s==3){
            s=0;
        }
        $('.slides li').eq(s).css('left','100%').animate({'left':0},600);
        $('.slides li').eq(s-1).css('left',0).animate({'left':'-100%'},600);
    },3000);

    });

</script>
