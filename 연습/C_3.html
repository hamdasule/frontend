<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 1000px;
        display: flex;
       
    }
    header{
        width: 25%;
        height: 650px;

    }
    header .logo{
        width: 100%;
        height: 100px;
        background-color: #333;
    }
    header nav{
        width: 100%;
        height: 550px;
        background-color: #888;
    }
    #main{
        width: 75%;
        height: 550px;
    }
    #main .slide{
        width: 100%;
        height: 350px;
        background-color: #ababab;
    }
    #main .contents{
        width: 100%;
        height: 200px;
        display: flex;
    }
    #main .contents .notice{
        width: 33.333%;
        height: 200px;
        background-color: #666;
    }
    #main .contents .gallery{
        width: 33.333%;
        height: 200px;
        background-color: #222;
    }
    #main .contents .banner{
        width: 33.333%;
        height: 200px;
        background-color: #555;
    }
    #main footer{
        width: 100%;
        height: 100px;
        display: flex;
    }
    footer .f_1{
        width: 25%;
        height: 100px;
        background-color: pink;
    }
    footer .f_2{
        width: 75%;
        height: 100px;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: plum;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: palegreen;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>
        <div id="main">
            <div class="slide"></div>

            <div class="contents">
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="banner"></div>
            </div>
        
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
