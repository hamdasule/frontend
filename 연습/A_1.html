<script>
    $(function(){

        $(".tab_title h2").click(function(){
        var i = $(this).index();
        $('.tab_list .list').css('display','none');
        $('.tab_list .list').eq(i).css('display','block');
        $(".tab_menu h2").removeClass('on').eq(i).addClass('on');

        });

    });
</script>
