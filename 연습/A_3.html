<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1200px;
        margin: 0 auto;
    }
    header{
        width: 100%;
        height: 100px;
        display: flex;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #999;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #888;
    }

    .slide{
        width: 100%;
        height: 300px;
        background-color: #444;
    }
    .contents{
        width: 100%;
        height: 200px;
        display: flex;
    }
    .contents .c1{
        width: 33.3333%;
        height: 200px;
        background-color: #666;
    }
    .contents .c2{
        width: 33.3333%;
        height: 200px;
        background-color: #333;
    }
    .contents .c3{
        width: 33.3333%;
        height: 200px;
        background-color: #555;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
    }
    footer .f_1{
        width: 20%;
        height: 100px;
        background-color: salmon;
    }
    footer .f_2{
        width: 80%;
        height: 100px;
        background-color: bisque;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: #222;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: #a2a2a2;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="c1">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
            <div class="c2"></div>
            <div class="c3"></div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
    </div>
</body>
</html>
