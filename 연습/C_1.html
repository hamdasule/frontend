<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1000px;
        display: flex;
    }
    header{
        width: 20%;
        height: 650px;
    }
    header .logo{
        width: 100%;
        height: 100px;
        background-color: #888;
    }
    header nav{
        width: 100%;
        height: 550px;
        background-color: #333;
    }
    #main{
        width: 80%;
        height: 650px;
    }
    #main .slide{
        width: 100%;
        height: 350px;
        background-color: #222;
    }
    #main .contents{
        width: 100%;
        height: 200px;
        display: flex;
    }
    #main .contents .c1{
        width: 33.3333%;
        height: 200px;
        background-color: skyblue;
    }
    #main .contents .c2{
        width: 33.3333%;
        height: 200px;
        background-color: darkkhaki;
    }
    #main .contents .c3{
        width: 33.3333%;
        height: 200px;
        background-color: pink;
    }
    #main footer{
        width: 100%;
        height: 100px;
        display: flex;
    }
    #main footer .f_1{
        width: 20%;
        height: 100px;
        background-color: #444;
    }
    #main footer .f_2{
        width: 80%;
        height: 100px;
    }
    #main footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: papayawhip;
    }
    #main footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: darkcyan;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav>
            </nav>
        </header>
        <div id="main">
            <div class="slide"></div>

            <div class="contents">
                <div class="c1">
                    <div class="notice"></div>
                    <div class="gallery"></div>
                </div>
                <div class="c2"></div>
                <div class="c3"></div>
            </div>
        
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
