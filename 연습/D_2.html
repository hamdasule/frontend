<html lang="en">

                            <li><a href="#">축제&행사</a></li>
                            <li><a href="#">전시</a></li>
                        </ul>
                    </li>
                    <li><a href="#">추천</a>
                        <ul class="sub">
                            <li><a href="#">에디터 추천</a></li>
                            <li><a href="#">테마코스</a></li>
                            <li><a href="#">도보해설관광</a></li>

                        </ul>
                    </li>
                    <li><a href="#">여행지</a>
                        <ul class="sub">
                            <li><a href="#">명소</a></li>
                            <li><a href="#">엔터테인먼트</a></li>

</html>
<script>
    $(function(){

        $('.gnb li ul').css('display','none');
        $('.gnb > li > a').click(function(){
            var n = $(this).next('.sub').css('display');

            if(n === 'none'){
                $('.sub').slideUp();
                $(this).next('.sub').slideDown();
            }else{
                $('.sub').slideUp();
            }
            return false;
        });
    });
</script>
