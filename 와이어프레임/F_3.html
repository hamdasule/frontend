<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0 ;padding: 0;}
    #wrap{
        width: 100%;
    }
    header{
        width: 1340px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: antiquewhite;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: olivedrab;
    }
    .slide{
        width: 100%;
        height: 350px;
        position: relative;
        background-color: #888;
    }
    .slide .link{
        width: 1340px;
        height: 100px;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        background-color: #222;
    }
    .contents{
        width: 1340px;
        height: 600px;
        margin: 0 auto;
    }
    .contents .c1{
        width: 100%;
        height: 200px;
        background-color: plum;
    }
    .contents .c2{
        width: 100%;
        height: 400px;
        background-color: palevioletred;
    }
    footer{
        width: 1340px;
        height: 120px;
        margin: 0 auto;
        display: flex;
    }
    footer .f_1{
        width: 20%;
        height: 120px;
        background-color: #333;
    }
    footer .f_2{
        width: 80%;
        height: 120px;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: #111;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: #555;
    }




    
</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide">
            <div class="link"></div>
        </div>

        <div class="contents">
            <div class="c1"></div>
            <div class="c2">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>

    </div>
</body>
</html>
