<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
        /* height: 700px; */
    }
    header{
        width: 100%;
        height: 100px;
        background-color: blue;
    }
    header .header_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        background-color: aqua;
    }
    header .header_container .logo{
        width: 20%;
        height: 100px;
        background-color: skyblue;
        float: left;
    }
     header .header_container nav{
        width: 80%;
        height: 100px;
        float: left;
        background-color: darkblue;
     }
     .slide{
        width: 1200px;
        height: 300px;
        margin: 0 auto;
        background-color: #999;
     }
     .contents{
        width: 1200px;
        height: 200px;
        margin: 0 auto;
        background-color: #888;
     }
     .contents .content{
        float: left;
     }
     .contents .notice{
        width: 33.33%;
        height: 200px;
        background-color: #777;
     }
     .contents .gallery{
        width: 33.33%;
        height: 200px;
        background-color: #666;
     }
     .contents .shortcut{
        width: 33.33%;
        height: 200px;
        background-color: #555;
     }
     footer{
        width: 100%;
        height: 100px;
        background-color: aquamarine;
     }
     footer .footer_container{
        width: 1200px;
        height: 100px;
        margin: 0 auto;
        background-color: #444;
     }
     footer .footer_container .f_1{
        width: 80%;
        height: 100px;
        float: left;
        background-color: #333;
     }
     footer .footer_container .f_2{
        width: 20%;
        height: 100px;
        float: right;
        background-color: #222;
     }
     footer .footer_container .f_2 .f_sns{
        width: 100%;
        height: 50px;
        background-color: yellowgreen;
     }
     footer .footer_container .f_2 .f_family{
        width: 100%;
        height: 50px;
        background-color: green;
     }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="header_container">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </div>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="content notice"></div>
            <div class="content gallery"></div>
            <div class="content shortcut"></div>
        </div>

        <footer>
            <div class="footer_container">
                <div class="f_1"></div>
                <div class="f_2">
                    <div class="f_sns"></div>
                    <div class="f_family"></div>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
