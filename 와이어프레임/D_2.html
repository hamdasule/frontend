<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    aside{
        width: 200px;
        height: 650px;
        background-color: #999;
    }
    aside .logo{
        width: 100%;
        height: 20%;
        background-color: palevioletred;
    }
    aside nav{
        width: 100%;
        height: 80%;
        background-color: pink;
    }
    #main{
        width: calc(100% - 200px);
        height: 650px;
        background-color: #888;
    }
    #main .slide_container{
        width: 100%;
        height: 400px;
        display: flex;
        background-color: #555;
    }
    #main .slide_container .slide{
        width: calc(100% - 230px);
        height: 400px;
        background-color: aqua;
    }
    #main .slide_container .banner{
        width: 230px;
        height: 400px;
        background-color: skyblue;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        display: flex;
        background-color: plum;
    }
    #main .contents .notice{
        width: 50%;
        height: 250px;
        background-color: orange;
    }
    #main .contents .gallery{
        width: 50%;
        height: 250px;
        background-color: red;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #444;
    }
    footer .f_logo{
        width: 18%;
        height: 100px;
        background-color: gold;
    }
    footer .f_copy{
        width: 62%;
        height: 100px;
        background-color: green;
    }
    footer .f_family{
        width: 20%;
        height: 100px;
        background-color: greenyellow;
    }





</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>

        <div id="main">
            <div class="slide_container">
            <div class="slide"></div>
            <div class="banner"></div>
            </div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_family"></div>
        </footer>
    </div>
</body>
</html>
