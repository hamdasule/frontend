<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
    }
    header{
        width: 1340px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #111;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #888;
    }
    .slide{
        width: 100%;
        height: 350px;
        position: relative;
        background-color: palegoldenrod;
    }
    .slide .link{
        width: 1340px;
        height: 100px;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        background-color: burlywood;
    }
    .contents{
        width: 1340px;
        height: 600px;
        margin: 0 auto;
    }
    .contents .c1{
        width: 100%;
        height: 200px;
        background-color: #222;
    }
    .contents .c2{
        width: 100%;
        height: 400px;
        display: flex;
    }
    .contents .c2 .notice{
        width: 50%;
        height: 400px;
        background-color: palegreen;
    }
    .contents .c2 .gallery{
        width: 50%;
        height: 400px;
        background-color: green;
    }
    footer{
        width: 1340px;
        height: 100px;
        margin: 0 auto;
        display: flex;
    }
    footer .f_logo{
        width: 20%;
        height: 100px;
        background-color: aquamarine;
    }
    footer .f_copy{
        width: 60%;
        height: 100px;
        background-color: darkcyan;
    }
    footer .f_family{
        width: 20%;
        height: 100px;
        background-color: darkolivegreen;
    }




</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide">
            <div class="link"></div>
        </div>

        <div class="contents">
            <div class="c1"></div>
            <div class="c2">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_family"></div>
        </footer>

    </div>
</body>
</html>
