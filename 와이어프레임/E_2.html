<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
            width: 100%;
    }
    #main{
        width: 100%;
        height: 800px;
        display: flex;
        background-color: #999;
    }
    #main .aside{
        width: 200px;
        height: 800px;
        background-color: #888;
    }
    #main .aside .logo{
        width: 100%;
        height: 10%;
        background-color: aqua;
    }
    #main .aside .nav{
        width: 100%;
        height: 90%;
        background-color: blue;
    }
    #main .contents{
        width: 400px;
        height: 800px;
        background-color: #777;
    }
    #main .contents .notice{
        width: 100%;
        height: 350px;
        background-color: palegreen;
    }
    #main .contents .gallery{
        width: 100%;
        height: 350px;
        background-color: green;
    }
    #main .contents .link{
        width: 100%;
        height: 100px;
        background-color: darkgreen;
    }
    #main .slide{
        width: calc(100% - 600px);
        height: 800px;
        background-color: orchid;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #444;
    }
    footer .f_logo{
        width: 20%;
        height: 100px;
        background-color: yellow;
    }
    footer .f_copy{
        width: 60%;
        height: 100px;
        background-color: goldenrod;
    }
    footer .f_family{
        width: 20%;
        height: 100px;
        background-color: lemonchiffon;
    }




</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <div class="aside">
                <div class="logo"><a href="#"><img src="" alt=""></a></div>
                <nav></nav>
            </div>

            <div class="contents">
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="link"></div>
            </div>

            <div class="slide"></div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_family"></div>
        </footer>
    </div>
</body>
</html>
