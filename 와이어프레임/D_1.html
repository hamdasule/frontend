<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap; /* flex 정렬을 유지하면서 줄을 바꿔라 */
    }
    aside{
        width: 200px;
        height: 850px;
        background-color: #999;
    }
    aside .logo{
        width: 200px;
        height: 20%;
        background-color: aqua;
    }
    aside nav{
        width: 200px;
        height: 80%;
        background-color: blue;
    }
    #main{
        width: calc(100% - 200px); /* 단위가 다른 값을 계산할 때 쓰는 함수 */
        height: 850px;
        background-color: pink;
    }
    #main .slide{
        width: 100%;
        height: 400px;
        background-color: palevioletred;
    }
     #main .slide .link{
        width: 100px;
        height: 300px;
        background-color: #bbb;
        position: absolute;
        top: 0;
        right: 0;
     }
    #main .banner{
        width: 100%;
        height: 200px;
        background-color: #888;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        background-color: plum;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #777;
    }
    footer .f_logo{
        width: 18%;
        height: 100px;
        background-color: purple;
    }
    footer .f_copy{
        width: 62%;
        height: 100px;
        background-color: #666;
    }
    footer .f_sns{
        width: 20%;
        height: 100px;
        background-color: #333;
    }




</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>

        <div id="main">
            <div class="slide">
                <div class="link"></div>
            </div>

            <div class="banner"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_sns"></div>
        </footer>
    </div>
</body>
</html>
