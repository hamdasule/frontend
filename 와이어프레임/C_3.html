<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width: 1000px;
        display: flex;
       
    }
    aside{
        width: 25%;
        height: 650px;
        background-color: #999;
    }
    aside .logo{
        width: 100%;
        height: 100px;
        background-color: #111;
    }
    aside nav{
        width: 100%;
        height: 550px;
        background-color: #888;
    }
    #main{
        width: 75%;
        height: 550px;
        background-color: #777;
    }
    #main .slide{
        width: 100%;
        height: 350px;
        background-color: aqua;
    }
    #main .contents{
        width: 100%;
        height: 200px;
        display: flex;
        background-color: blue;
    }
    #main .contents .notice{
        width: 33.333%;
        height: 200px;
        background-color: #666;
    }
    #main .contents .gallery{
        width: 33.333%;
        height: 200px;
        background-color: #222;
    }
    #main .contents .banner{
        width: 33.333%;
        height: 200px;
        background-color: #555;
    }
    #main footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #444;
    }
    footer .f_1{
        width: 25%;
        height: 100px;
        background-color: pink;
    }
    footer .f_2{
        width: 75%;
        height: 100px;
        background-color: palevioletred;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: plum;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: palegreen;
    }




</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>
        <div id="main">
            <div class="slide"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
                <div class="content banner"></div>
            </div>
        
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
