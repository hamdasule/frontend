<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    header{
        width: 200px;
        height: 850px;
        background-color: #999;
    }
    header .logo{
        width: 200px;
        height: 20%;
        background-color: #111;
    }
    header nav{
        width: 200px;
        height: 80%;
        background-color: #888;
    }
    #main{
        width: calc(100% - 200px);
        height: 850px;
        background-color: #aaa;
    }
    #main .slide{
        width: 100%;
        height: 400px;
        background-color: #777;
        position: relative;
    }
    .slide .link{
        width: 100px;
        height: 300px;
        background-color: #222;
        position: absolute;
        top: 0;
        right: 0;
    }
    #main .banner{
        width: 100%;
        height: 200px;
        background-color: #333;
    }
    #main .cintents{
        width: 100%;
        height: 250px;
        background-color: #666;
    }
    footer{
        width: 100%;
        height: 120px;
        background-color: #bbb;
        display: flex;
    }
    footer .f_1{
        width: 200px;
        height: 120px;
        background-color: #ccc;
    }
    footer .f_2{
        width: calc(100% - 200px);
        height: 120px;
        background-color: #a1a1a1;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: #555;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: #c1c1c1;
    }
  

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"></a></div>
            <nav></nav>
        </header>

        <div id="main">
            <div class="slide">
                <div class="link"></div>
            </div>

            <div class="banner"></div>

            <div class="contents">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
    </div>
    
    
</body>
</html>
