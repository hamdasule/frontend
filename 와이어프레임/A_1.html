<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1200px;
        height: 700px;
        margin: 0 auto;
        background-color: #999;
    }
    header{
        width: 100%;
        height: 100px;
        background-color: #888;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #777;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #666;
    }
    .slide{
        width: 100%;
        height: 300px;
        background-color: #555;
    }
    .contents{
        width: 100%;
        height: 200px;
        background-color: #444;
    }
    .contents .content{
        float: left;
    }
    .contents .c1{
        width: 33.33%;
        height: 200px;
        background-color: #333;
    }
    .contents .c2{
        width: 33.33%;
        height: 200px;
        background-color: #aaa;
    }
    .contents .c3{
        width: 33.33%;
        height: 200px;
        background-color: #bbb;
    }
    footer{
        width: 100%;
        height: 100px;
        background-color: #ccc;
    }
    footer .foot{
        float: left;
    }
    footer .f_logo{
        width: 200px;
        height: 100px;
        background-color: #ddd;
    }
    footer .f_copy{
        width: 700px;
        height: 100px;
        background-color: #ededed;
    }
    footer .f_sns{
        width: 300px;
        height: 100px;
        background-color: #e0e0e0;
    }

</style>

</head>
<body>
    <div id="wrap">

        <header>
            <div class="logo"></div>
            <nav>
                
            </nav>
        </header>
    

    <div class="slide"></div>

    <div class="contents">
        <div class="content c1"></div>
        <div class="content c2"></div>
        <div class="content c3"></div>
    </div>

    <footer>
        <div class="foot f_logo"></div>
        <div class="foot f_copy"></div>
        <div class="foot f_sns"></div>
    </footer>
</div>

</body>
</html>
