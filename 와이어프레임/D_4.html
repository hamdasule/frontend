<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #wrap{
        width:100%;
        display: flex;
        flex-wrap: wrap;
    }
    aside{
        width: 200px;
        height: 800px;
        background-color: #999;
    }
    aside .logo{
        width: 200px;
        height: 20%;
        background-color: pink;
    }
    aside nav{
        width: 200px;
        height: 80%;
        background-color: palevioletred;
    }
    #main{
        width: calc(100% - 200px);
        height: 800px;
        background-color: #888;
    }
    #main .sldie{
        width: 100%;
        height: 400px;
        background-color: plum;
    }
    #main .link{
        width: 100%;
        height: 150px;
        background-color: purple;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        display: flex;
        background-color: #777;
    }
    #main .contents .notice{
        width: 50%;
        height: 250px;
        background-color: greenyellow;
    }
    #main .contents .gallery{
        width: 50%;
        height: 250px;
        background-color: sandybrown;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
        background-color: #666;
    }
    footer .f_1{
        width: 20%;
        height: 120px;
        background-color: darkorange;
    }
    footer .f_2{
        width: 60%;
        height: 120px;
        background-color: brown;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: green;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: darkkhaki;
    }

    footer .f_3{
        width: 20%;
        height: 120px;
        background-color: #444;
    }


</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>

        <div id="main">
            <div class="sldie"></div>

            <div class="link"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            <div class="f_3"></div>
        </footer>
    </div>
</body>
</html>
