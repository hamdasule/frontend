<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #wrap{
            width: 1200px;
            height: 700px;
            margin: 0 auto;
        }
        header{
            width: 100%;
            height: 100px;
            background-color: #999;
        }
        header .logo{
            width: 20%;
            height: 100px;
            background-color: #888;
        }
        header nav{
            width: 80%;
            height: 100px;
            background-color: #777;
        }
        .slide{
            width: 100%;
            height: 300px;
            background-color: #666;
        }
        .contents{
            width: 100%;
            height: 200px;
            background-color: #555;
        }
        .contents .content{
            float: left;
        }
        .contents .notice{
            width: 33.33%;
            height: 200px;
            background-color: #444;
        }
        .contents .gallery{
            width: 33.33%;
            height: 200px;
            background-color: #333;
        }
        .contents .banner{
            width: 33.33%;
            height: 200px;
            background-color: #222;
        }
        footer{
            width: 100%;
            height: 100px;
            background-color: #111;
        }
        footer .foot{
            float: left;
        }
        footer .f_logo{
            width: 200px;
            height: 100px;
            background-color: #aaa;
        }
        footer .f_copy{
            width: 700px;
            height: 100px;
            background-color: #bbb;
        }
        footer .f_family{
            width: 300px;
            height: 100px;
            background-color: #ccc;
        }

    </style>
</head>
<body>
    <div id="wrap">

        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav>

            </nav>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="content notice"></div>
            <div class="content gallery"></div>
            <div class="content banner"></div>
        </div>

        <footer>
            <div class="foot f_logo"></div>
            <div class="foot f_copy"></div>
            <div class="foot f_family"></div>
        </footer>
    </div>
    
</body>
</html>
