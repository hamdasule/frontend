<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
    }
    #main{
        width: 100%;
        height: 850px;
        background-color: #999;
        display: flex;
    }
    #main header{
        width: 200px;
        height: 850px;
        background-color: #111;
    }
    #main header .logo{
        width: 200px;
        height: 100px;
        background-color: #888;
    }
    #main header nav{
        width: 200px;
        height: 750px;
        background-color: #aaa;
    }
    #main .contents{
        width: 400px;
        height: 850px;
        background-color: #222;
    }
    #main .contents .banner{
        width: 400px;
        height: 150px;
        background-color: #777;
    }
    #main .contents .notice{
        width: 400px;
        height: 350px;
        background-color: #333;
    }
    #main .contents .gallery{
        width: 400px;
        height: 350px;
        background-color: #666;
    }
    #main .slide{
        width: calc(100% - 600px);
        height: 850px;
        background-color: #555;
    }
    footer{
        width: 100%;
        height: 100px;
        background-color: #bbb;
        display: flex;
    }
    footer .f_logo{
        width: 200px;
        height: 100px;
        background-color: #ccc;
    }
    footer .f_copy{
        width: calc(100% - 400px);
        height: 100px;
        background-color: #c1c1c1;
    }

    footer .f_sns{
        width: 200px;
        height: 100px;
        background-color: #a1a1a1;
    }




</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <header>
                <div class="logo"></div>
                <nav></nav>
            </header>

            <div class="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>

            <div class="slide"></div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_sns"></div>
        </footer>
    </div>
   
</body>
</html>
