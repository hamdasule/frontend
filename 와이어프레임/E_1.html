<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 100%;
    }
    #main{
        width: 100%;
        height: calc(100vh - 120px); /*높이가 100% -000px 경우*/
        background-color: #999;
        display: flex;
        flex-wrap: wrap;
    }
    #main header{
        width: 200px;
        height: 100%;
        background-color: #111;
    }
    #main header .logo{
        width: 200px;
        height: 10%;
        background-color: #888;
    }
    #main header nav{
        width: 200px;
        height: 90%;
        background-color: #222;
    }
    #main .contents{
        width: 400px;
        height: 100%;
        background-color: #333;
    }
    .contents .banner{
        width: 400px;
        height: 15%;
        background-color: #777;
    }
    .contents .notice{
        width: 400px;
        height: 35%;
        background-color: #444;
    }
    .contents .gallery{
        width: 400px;
        height: 35%;
        background-color: #ccc;
    }
    .contents .link{
        width: 400px;
        height: 15%;
        background-color: #555;
    }
    #main .slide{
        width: calc(100% - 600px);
        height: 100%;
        background-color: #c1c1c1;
    }
    footer{
        width: 100%;
        height: 120px;
        background-color: #666;
        display: flex;
    }
    footer .f_1{
        width: 200px;
        height: 120px;
        background-color: #ddd;
    }
    footer .f_2{
        width: calc(100% - 200px);
        height: 120px;
        background-color: #ddd;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: pink;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: rgb(194, 107, 121);
    }

</style>

</head>
<body>
    <div id="wrap">
        <div id="main">
            <header>
                <div class="logo"></div>
                <nav></nav>
            </header>

            <div class="contents">
                <div class="banner"></div>
                <div class="notice"></div>
                <div class="gallery"></div>
                <div class="link"></div>
            </div>

            <div class="slide"></div>
        </div>
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
    </div>

 
    
</body>
</html>
