<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1000px;
        height: 650px;
        
    }
    aside{
        width: 25%;
        height: 650px;
        float: left;
        background-color: #888;
    }
    aside .logo{
        width: 100%;
        height: 100px;
        background-color: aqua;
    }
    aside nav{
        width: 100%;
        height: 550px;
        background-color: blue;
    }
    #main{
        width: 75%;
        height: 550px;
        float: right;
        background-color: #777;
    }
    #main .slide{
        width: 100%;
        height: 350px;
        background-color: yellow;
    }
    #main .contents{
        width: 100%;
        height: 200px;
        background-color: green;
    }
    #main .contents .c1{
        width: 33.33%;
        height: 200px;
        float: left;
        background-color: pink;
    }
    #main .contents .c2{
        width: 33.33%;
        height: 200px;
        float: left;
        background-color: hotpink;
    }
    #main .contents .c3{
        width: 33.33%;
        height: 200px;
        float: left;
        background-color: plum;
    }
    #main footer{
        width: 100%;
        height: 100px;
        background-color: orange;
    }
    footer .f_1{
        width: 20%;
        height: 100px;
        float: left;
        background-color: #333;
    }
    footer .f_2{
        width: 80%;
        height: 100px;
        float: right;
        background-color: #222;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: palevioletred;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: purple;
    }


</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </aside>
        <div id="main">
            <div class="slide"></div>
            <div class="contents">
                <div class="content c1"></div>
                <div class="content c2"></div>
                <div class="content c3"></div>
            </div>
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
