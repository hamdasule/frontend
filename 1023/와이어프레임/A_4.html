<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    #wrap{
        width: 1200px;
        height: 700px;
        margin: 0 auto;
        background-color: #888;
    }
    header{
        width: 100%;
        height: 100px;
        background-color: #999;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #777;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #666;
    }
    .slide{
        width: 100%;
        height: 300px;
        background-color: #555;
    }
    .contents{
        width: 100%;
        height: 200px;
        background-color: #444;
    }
    .contents .content{
        float: left;
    }
    .contents .notice{
        width: 33.33%;
        height: 200px;
        background-color: #333;
    }
    .contents .gallery{
        width: 33.33%;
        height: 200px;
        background-color: #222;
    }
    .contents .banner{
        width: 33.33%;
        height: 200px;
        background-color: #111;
    }
    footer{
        width: 100%;
        height: 100px;
    }
    footer .f_menu{
        float: left;
        width: 70%;
        height: 50px;
        background-color: pink;
    }
    footer .f_copy{
        float: left;
        width: 70%;
        height: 50px;
        background-color: hotpink;
    }
    footer .f_family{
        float: right;
        width: 30%;
        height: 100px;
        background-color: #ddd;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav></nav>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="content notice"></div>
            <div class="content gallery"></div>
            <div class="content banner"></div>
        </div>
        <footer>
            <div class="foot f_family"></div>
            <div class="foot f_menu"></div>
            <div class="foot f_copy"></div>
        </footer>
        <!-- family 순서를 위로올림 전체 감싸는거 오류남 -->
    </div>
</body>
</html>
