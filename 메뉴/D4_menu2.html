<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-1.12.3.js"></script>
<style>
    *{margin: 0;padding: 0;}
    ul, li{list-style: none;}
    a{text-decoration: none; color: #111;}
    
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    header{
        width: 200px;
        height: 800px;
        position: relative;
        z-index: 9999;
    }
    header .logo{
        width: 100%;
        height: 20%;
        background-color: pink;
    }
    header nav{
        width: 100%;
        height: 80%;
        background-color: palevioletred;
        position: relative;
    }
    header nav .gnb{
        width: 90%;
        background-color: silver;
        position: relative;
        z-index: 11;
        margin: 0 auto;
    }
    header nav .gnb > li{
        width: 100%;
        text-align: center;
        position: relative;
    }
    header nav .gnb > li > a{
        display: block;
        line-height: 50px;
        font-size: 20px;
        font-weight: bold;
    }
    header nav .gnb > li:hover > a{
        background-color: #111;
        color: #fff;
    }
    header nav .gnb > li > ul{
        position: absolute;
        top: 0;
        left: 180px;
        width: 900px;
        display: none;
    }
    header nav .gnb > li > ul > li{
        float: left;
        line-height: 50px;
        width: 180px;
        background-color: antiquewhite;

    }
    header nav .gnb > li > ul > li > a{
        display: block;
        width: 100%;   
    }
    header nav .gnb > li > ul > li > a:hover{
        background-color: azure;
        color: darkblue;

    }
    .nav-bg{
        position: absolute;
        top: 0px;
        left: 180px;
        width:0px;
        height:200px;
        z-index: 10;
        background-color: antiquewhite;
    }

    #main{
        width: calc(100% - 200px);
    }
    #main .sldie{
        width: 100%;
        height: 400px;
        background-color: #777;
    }
    #main .link{
       width: 100%;
        height: 150px;
        background-color: #222;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        display: flex;
    }
    #main .contents .notice{
        width: 50%;
        height: 250px;
        background-color: skyblue;
    }
    #main .contents .gallery{
        width: 50%;
        height: 250px;
        background-color: darkblue;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
    }
    footer .f_1{
        width: 200px;
        height: 120px;
        background-color: #444;
    }
    footer .f_2{
        width: calc(100% - 500px);
        height: 120px;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: aqua;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: blueviolet;
    }
    footer .f_3{
        width: 300px;
        height: 120px;
        background-color: #333;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            
            <nav>
                <ul class="gnb">
                    <li><a href="#">인기모음전</a>
                        <ul class="sub">
                            <li><a href="#">수저모음</a></li>
                            <li><a href="#">도마모음</a></li>
                            <li><a href="#">그릇모음</a></li>
                            <li><a href="#">접시모음</a></li>
                        </ul>
                    </li>
                    <li><a href="#">베스트상품</a>
                        <ul class="sub">
                            <li><a href="#">주방용품</a></li>
                            <li><a href="#">설비용품</a></li>
                            <li><a href="#">인덕션제품</a></li>
                            <li><a href="#">실리콘제품</a></li>
                        </ul>
                    </li>
                    <li><a href="#">업종별샵</a>
                        <ul class="sub">
                            <li><a href="#">한식기물</a></li>
                            <li><a href="#">양식기물</a></li>
                            <li><a href="#">일식기물</a></li>
                            <li><a href="#">중식기물</a></li>
                        </ul>
                    </li>
                    <li><a href="#">인덕션용품</a>
                        <ul class="sub">
                            <li><a href="#">냄비/솥</a></li>
                            <li><a href="#">후라이팬/주물</a></li>
                            <li><a href="#">인덕션렌지</a></li>
                            <li><a href="#">기타제품</a></li>
                        </ul>
                    </li>
                </ul>
                 <div class="nav-bg"></div>
            </nav>
           
        </header>

        <div id="main">
    
            <div class="sldie"></div>

            <div class="link"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            <div class="f_3"></div>
        </footer>
    </div>
</body>
</html>
<script>
    $(function(){
        $('.gnb > li').mouseenter(function(){
            $('.nav-bg').stop().animate({width:'1800px'},400)
            $('.gnb > li > ul').stop().fadeIn(250);
        });
        $('.gnb > li').mouseleave(function(){
            $('.nav-bg').stop().animate({width:'0'},400)
            $('.gnb > li > ul').stop().fadeOut(250);
        });
    });
</script>
