<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-1.12.3.js"></script>
<style>
    *{margin: 0;padding: 0;}
    ul ,li{list-style: none;}
    a{text-decoration: none; color: #111;}
    #wrap{
        width: 1000px;
        display: flex;
    }
    aside{
        width: 25%;
        height: 650px;
        position: relative;
    }
    aside .logo{
        width: 100%;
        height: 100px;
        background-color: #111;
    }
    aside nav{
        width: 100%;
        height: 550px;
        background-color: #888;
    }
    aside nav .gnb{
        width: 90%;
        background-color: silver;
        position: absolute;
        top: 120px;
        left: 50%;
        transform: translateX(-50%);
    }
    aside nav .gnb > li{
        text-align: center;
        width: 100%;
        position: relative;
    }
    aside nav .gnb > li >a{
        display: block;
        font-size: 20px;
        line-height: 50px;
        font-weight: bold;
    }
    aside nav .gnb > li:hover >a{
        background-color: #222;
        color: #fff;
    }
    aside nav .gnb > li > ul{
        position: absolute;
        left: 100%;
        top: 0;
        line-height: 40px;
        width: 180px;
        background-color: #aaa;
        display: none;
    }
    aside nav .gnb > li > ul > li > a{
        display: block;
        width: 100%;
    }
    aside nav .gnb > li > ul > li > a:hover{
        background-color: #333;
        color: silver;
    }


    #main{
        width: 75%;
        height: 550px;
        background-color: #777;
    }
    #main .slide{
        width: 100%;
        height: 350px;
        background-color: aqua;
    }
    #main .contents{
        width: 100%;
        height: 200px;
        display: flex;
        background-color: blue;
    }
    #main .contents .notice{
        width: 33.333%;
        height: 200px;
        background-color: #666;
    }
    #main .contents .gallery{
        width: 33.333%;
        height: 200px;
        background-color: #222;
    }
    #main .contents .banner{
        width: 33.333%;
        height: 200px;
        background-color: #555;
    }
    #main footer{
        width: 100%;
        height: 100px;
        display: flex;
        background-color: #444;
    }
    footer .f_1{
        width: 25%;
        height: 100px;
        background-color: pink;
    }
    footer .f_2{
        width: 75%;
        height: 100px;
        background-color: palevioletred;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 50px;
        background-color: plum;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 50px;
        background-color: palegreen;
    }


</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav>
                <ul class="gnb">
                    <li><a href="#">협회소개</a>
                        <ul class="sub">
                            <li><a href="#">인사말</a></li>
                            <li><a href="#">명인</a></li>
                            <li><a href="#">오시는길</a></li>
                        </ul>
                    </li>
                    <li><a href="#">행사안내</a>
                        <ul class="sub">
                            <li><a href="#">요리경연대회</a></li>
                            <li><a href="#">전시참가</a></li>
                            <li><a href="#">참가신청</a></li>
                        </ul>
                    </li>
                    <li><a href="#">홍보마당</a>
                        <ul class="sub">
                            <li><a href="#">축제소식</a></li>
                            <li><a href="#">보도자료</a></li>
                            <li><a href="#">레시피</a></li>
                        </ul>
                    </li>
                    <li><a href="#">회원마당</a>
                        <ul class="sub">
                            <li><a href="#">Q&A</a></li>
                            <li><a href="#">사진갤러리</a></li>
                            <li><a href="#">공지사항</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>
        <div id="main">
            <div class="slide"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
                <div class="content banner"></div>
            </div>
        
        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
        </footer>
        </div>
    </div>
</body>
</html>
<script>
    $(function(){
        $('.gnb > li').mouseenter(function(){
            $(this).children('.sub').stop().slideDown(270);
        });
        $('.gnb > li').mouseleave(function(){
            $(this).children('.sub').stop().slideUp(270);
        });

    });
</script>
