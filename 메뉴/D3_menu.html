<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-1.12.3.js"></script>

<style>
    *{margin: 0;padding: 0;}
    ul, li{list-style: none;}
    a{text-decoration: none; color: #111;}
    #wrap{
        width: 100%;
        display: flex;
        flex-wrap: wrap;
    }
    header{
        width: 200px;
        height: 850px;
        position: relative;
        z-index: 9999;
    }
    header .logo{
        width: 200px;
        height: 20%;
        background-color: #999;
    }
    header nav{
        width: 200px;
        height: 80%;
        background-color: #aaa;
        position: relative;
    }

    header nav .gnb{
        width: 90%;
        background-color: seashell;
        position: relative;
        margin: 0 auto;
        z-index: 11;
    }
    header nav .gnb > li{
        text-align: center;
        width: 100%;
        position: relative;
    }
    header nav .gnb > li > a{
        display: block;
        font-size: 20px;
        font-weight: bold;
        line-height: 50px;
    }
    header nav .gnb > li:hover > a{
        background-color: #222;
        color: #fff;
    }
    header nav .gnb > li > ul{
        position: absolute;
        top: 0;
        left: 180px;
        width: 900px;
        display: none;
    }
    header nav .gnb > li > ul > li{
        float: left;
        line-height: 50px;
        width: 180px;
        background-color: aliceblue;
    }
    
    header nav .gnb > li > ul > li > a{
        width: 100%;
        display: block;
    }
    header nav .gnb > li > ul > li > a:hover{
        background-color: #444;
        color: #fff;
    }
    .nav-bg{
        position: absolute;
        top: 0;
        left: 180px;
        background-color: aliceblue;
        width: 0px;
        height: 200px;
        z-index: 10;
    }


    #main{
        width: calc(100% - 200px);
        height: 850px;
        background-color: #888;
    }
    #main .slide{
        width: 100%;
        height: 400px;
        background-color: blue;
    }
    #main .slide .link{
        width: 100px;
        height: 300px;
        background-color: #444;
        position: absolute;
        top: 0;
        right: 0;
    }
    #main .banner{
        width: 100%;
        height: 200px;
        background-color: skyblue;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        background-color: #777;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
    }
    footer .f_1{
        width: 200px;
        height: 120px;
        background-color: #555;
    }
    footer .f_2{
        width: calc(100% - 200px);
        height: 120px;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: #222;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: #d1d1d1;
    }



</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav>
                <ul class="gnb">
                    <li><a href="#">OnSale</a>
                        <ul class="sub">
                            <li><a href="#">할인행사</a></li>
                            <li><a href="#">덤증정</a></li>
                        </ul>
                    </li>
                    <li><a href="#">기획전</a>
                        <ul class="sub">
                            <li><a href="#">봄 먹거리</a></li>
                            <li><a href="#">여름 먹거리</a></li>
                            <li><a href="#">가을 먹거리</a></li>
                            <li><a href="#">겨울 먹거리</a></li>
                        </ul>
                    </li>
                    <li><a href="#">푸른마을 레시피</a>
                        <ul class="sub">
                            <li><a href="#">메인요리</a></li>
                            <li><a href="#">밑반찬</a></li>
                            <li><a href="#">간식</a></li>
                            <li><a href="#">브런치</a></li>
                        </ul>
                    </li>
                    <li><a href="#">매장안내</a>
                        <ul class="sub">
                            <li><a href="#">신규매장</a></li>
                            <li><a href="#">추천매장</a></li>
                            <li><a href="#">공지사항</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="nav-bg"></div>
            </nav>
        </header>

        <div id="main">
            <div class="slide">
                <div class="link"></div>
            </div>

            <div class="banner"></div>

            <div class="contents">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
                </div>
        </footer>
    </div>
    
</body>
</html>
<script>
    $(function(){
        $('.gnb > li').mouseenter(function(){
            $('.nav-bg').stop().animate({width:'1800px'},300);
            $('.gnb > li > ul').stop().fadeIn(300);
        });
        $('.gnb > li').mouseleave(function(){
            $('.nav-bg').stop().animate({width:'0px'},300);
            $('.gnb > li > ul').stop().fadeOut(300);
        });
    });
</script>
