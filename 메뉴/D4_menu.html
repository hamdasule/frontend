<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;}
    ul, li{list-style: none;}
    a{text-decoration: none; color: #111;}
    #wrap{
        width:100%;
        display: flex;
        flex-wrap: wrap;
    }
    aside{
        width: 200px;
        height: 800px;
        position: relative;
    }
    aside .logo{
        width: 200px;
        height: 20%;
        background-color: pink;
    }
    aside nav{
        width: 200px;
        height: 80%;
        background-color: palevioletred;
    }
    aside nav .gnb{
        width: 88%;
        background-color: #aaa;
        position: absolute;
        top: 175px;
        left: 50%;
        transform: translateX(-50%);
    }
    aside nav .gnb > li{
        float: left;
        width: 100%;
        text-align: center;
        position: relative;

    }
    aside nav .gnb > li > a{
        display: block;
        line-height: 50px;
        font-size: 20px;
        font-weight: bold;
    }
    aside nav .gnb > li:hover > a{
        background-color: #222;
        color: #fff;
    }
    aside nav .gnb > li > ul{
        position: absolute;
        top: 0;
        left: 100%;
        width: 200px;
        background-color: #666;
        line-height: 50px;
    }
    aside nav .gnb > li > ul > li > a{
        display: block;

    }



    #main{
        width: calc(100% - 200px);
        height: 800px;
    }
    #main .sldie{
        width: 100%;
        height: 400px;
        background-color: plum;
    }
    #main .link{
        width: 100%;
        height: 150px;
        background-color: purple;
    }
    #main .contents{
        width: 100%;
        height: 250px;
        display: flex;
    }
    #main .contents .notice{
        width: 50%;
        height: 250px;
        background-color: greenyellow;
    }
    #main .contents .gallery{
        width: 50%;
        height: 250px;
        background-color: sandybrown;
    }
    footer{
        width: 100%;
        height: 120px;
        display: flex;
        background-color: #666;
    }
    footer .f_1{
        width: 20%;
        height: 120px;
        background-color: darkorange;
    }
    footer .f_2{
        width: 60%;
        height: 120px;
    }
    footer .f_2 .f_menu{
        width: 100%;
        height: 60px;
        background-color: green;
    }
    footer .f_2 .f_copy{
        width: 100%;
        height: 60px;
        background-color: darkkhaki;
    }

    footer .f_3{
        width: 20%;
        height: 120px;
        background-color: #444;
    }

</style>

</head>
<body>
    <div id="wrap">
        <aside>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <div class="nav-bg"></div>
            <nav>
                <ul class="gnb">
                    <li><a href="#">인기모음전</a>
                        <ul class="sub">
                            <li><a href="#">수저모음</a></li>
                            <li><a href="#">도마모음</a></li>
                            <li><a href="#">그릇모음</a></li>
                            <li><a href="#">접시모음</a></li>
                        </ul>
                    </li>
                    <li><a href="#">베스트상품</a>
                        <ul class="sub">
                            <li><a href="#">주방용품</a></li>
                            <li><a href="#">설비용품</a></li>
                            <li><a href="#">인덕션제품</a></li>
                            <li><a href="#">실리콘제품</a></li>
                        </ul>
                    </li>
                    <li><a href="#">업종별샵</a>
                        <ul class="sub">
                            <li><a href="#">한식기물</a></li>
                            <li><a href="#">양식기물</a></li>
                            <li><a href="#">일식기물</a></li>
                            <li><a href="#">중식기물</a></li>
                        </ul>
                    </li>
                    <li><a href="#">인덕션용품</a>
                        <ul class="sub">
                            <li><a href="#">냄비/솥</a></li>
                            <li><a href="#">후라이팬/주물</a></li>
                            <li><a href="#">인덕션렌지</a></li>
                            <li><a href="#">기타제품</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>

        <div id="main">
            <div class="sldie"></div>

            <div class="link"></div>

            <div class="contents">
                <div class="content notice"></div>
                <div class="content gallery"></div>
            </div>
        </div>

        <footer>
            <div class="f_1"></div>
            <div class="f_2">
                <div class="f_menu"></div>
                <div class="f_copy"></div>
            </div>
            <div class="f_3"></div>
        </footer>
    </div>
</body>
</html>
