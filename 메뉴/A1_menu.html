<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./js/jquery-1.12.3.js"></script>

<style>
    *{margin: 0;padding: 0;}
    ul, li{list-style: none;}
    a{text-decoration: none; color: black;}

    #wrap{
        width: 1200px;
        margin: 0 auto;
    }
    header{
        width: 100%;
        height: 100px;
        display: flex;
        position: relative;
    }
    header .logo{
        width: 20%;
        height: 100px;
        background-color: #999;
    }
    header nav{
        width: 80%;
        height: 100px;
        background-color: #777;
    }
    header nav .gnb{
        width: 600px;
        height: 50px;
        position: absolute;
        top: 25px;
        right: 25px;
        background-color: aliceblue;
    }
    header nav .gnb > li{
        width: 25%;
        height: 50px;
        float: left;
        text-align: center;
        position: relative;
    }
    header nav .gnb > li > a{
        font-size: 22px;
        font-weight: bold;
        line-height: 50px;
        display: block;
    }
    header nav .gnb > li:hover > a{
        background-color: #222;
        color: #fff;
    }
    header nav .gnb > li > ul{
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        line-height: 40px;
        background-color: palegoldenrod;
        display: none;
    }
    header nav .gnb > li > ul > li >a{
        display: block;
        width: 100%;
    }
    header nav .gnb > li > ul > li >a:hover{
        color: #fff;
        background-color: #444;
    }

    .slide{
        width: 100%;
        height: 300px;
        background-color: #222;
    }
    .contents{
        width: 100%;
        height: 200px;
        display: flex;
    }
    .contents .c1{
        width: 33.333%;
        height: 200px;
        background-color: aqua;
    }
    .contents .c2{
        width: 33.333%;
        height: 200px;
        background-color: blue;
    }
    .contents .c3{
        width: 33.333%;
        height: 200px;
        background-color: darkblue;
    }
    footer{
        width: 100%;
        height: 100px;
        display: flex;
    }
    footer .f_logo{
        width: 20%;
        height: 100px;
        background-color: palegreen;
    }
    footer .f_copy{
        width: 60%;
        height: 100px;
        background-color: green;
    }
    footer .f_sns{
        width: 20%;
        height: 100px;
        background-color: darkkhaki;
    }

</style>

</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"><a href="#"><img src="" alt=""></a></div>
            <nav>
                <ul class="gnb">
                    <li><a href="#">탑</a>
                        <ul>
                            <li><a href="#">블라우스</a></li>
                            <li><a href="#">티</a></li>
                            <li><a href="#">셔츠</a></li>
                            <li><a href="#">니트</a></li>
                        </ul>
                    </li>
                    <li><a href="#">아우터</a>
                        <ul>
                            <li><a href="#">자켓</a></li>
                            <li><a href="#">코트</a></li>
                            <li><a href="#">가디건</a></li>
                            <li><a href="#">머플러</a></li>
                        </ul>
                    </li>
                    <li><a href="#">팬츠</a>
                        <ul>
                            <li><a href="#">청바지</a></li>
                            <li><a href="#">짧은바지</a></li>
                            <li><a href="#">긴바지</a></li>
                            <li><a href="#">레깅스</a></li>
                        </ul>
                    </li>
                    <li><a href="#">악세서리</a>
                        <ul>
                            <li><a href="#">귀고리</a></li>
                            <li><a href="#">목걸이</a></li>
                            <li><a href="#">반지</a></li>
                            <li><a href="#">팔찌</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </header>

        <div class="slide"></div>

        <div class="contents">
            <div class="c1">
                <div class="notice"></div>
                <div class="gallery"></div>
            </div>
            <div class="c2"></div>
            <div class="c3"></div>
        </div>

        <footer>
            <div class="f_logo"></div>
            <div class="f_copy"></div>
            <div class="f_sns"></div>
        </footer>
    </div>
</body>
</html>
<script>
    $(function(){
        $('.gnb').mouseenter(function(){
            $('.gnb > li > ul').stop().slideDown();
        });
        $('.gnb').mouseleave(function(){
            $('.gnb > li > ul').stop().slideUp();
        });

    });
</script>
