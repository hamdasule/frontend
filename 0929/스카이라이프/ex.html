<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    *{margin: 0;padding: 0;box-sizing: border-box;}
.skylife-container{
    width: 1900px;
    height: 100%;
    /* border: 1px solid #333; */
    margin: 0 auto;
    position: relative;
}
h1{
    font-size: 50px;
    margin: 15px 0 35px 320px;
}
.f3{
    font-size: 18px;
    color: #666;
    position: absolute;
    top: 30px;
    right: 350px;
   
}
.box-container{
    display: flex;
    justify-content: center;
    gap: 23px;
}
.bigbox{
    width: 400px;
    height: 540px;
    border-radius: 15px;
    padding: 64px 16px 16px;
    position: relative;
}
.bigbox1{
    background-color: #ffab60;}
.bigbox2{
    background-color: #bdd58f;}
.bigbox3{
    background-color: #89b7dd;}

img{
    width: 358px;
    height: 280px;
}
.box{
    /* width: 400px;
    height: 170px; */
    width: 368px;
    height: 130px;
    background-color: #fff;
    border-radius: 10px;
    position: absolute;
    bottom: 15px;
    /* padding: 20px 12px 20px 20px; */
}
.box .f1{
    font-size: 24px;
    font-weight: bold;
    padding: 17px 0 10px 18px;
}

.box .f2{
    color: #666;
    padding-left: 18px;
}
.box > img{
    width: 24px;
    height: 24px;
    float: right;
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
}
.skylife-container > img{
    width: 24px;
    height: 24px;
    position: absolute;
    top: 30px;
    right: 325px;
}
    
</style>

</head>
<body>
    <div class="skylife-container">
        <h1>KT망 그대로 이용하는</h1>
        <img src="images/right_b94.png" alt="그레이화살표">
        <p class="f3">모바일 상품 모두보기</p>
        <div class="box-container">
        <div class="bigbox bigbox1">
            <img src="images/img_mobile_esim.png" alt="이심">
            <div class="box">
                <p class="f1">요즘 다 eSIM 개통하는 이유</p>
                <p class="f2">실물 유심 구매 없이 <br/> 지금 바로 개통 가능하니까!</p>
                <img src="images/right_b94.png" alt="화살표">
            </div>
        </div>
        <div class="bigbox bigbox2">
            <img src="images/img_mobile_usim.png" alt="유심">
            <div class="box">
                <p class="f1">유심 구매 A to Z</p>
                <p class="f2">온오프라인 구매방법을 <br/> 자세히 알려 드릴게요!</p>
                <img src="images/right_b94.png" alt="화살표">
            </div>
        </div>
        <div class="bigbox bigbox3">
            <img src="images/img_mobile_plan.png" alt="플랜">
            <div class="box">
                <p class="f1">이주의 인기 요금제</p>
                <p class="f2">오직 스카이라이프에서만 <br/> 만나 보실 수 있어요</p>
                <img src="images/right_b94.png" alt="화살표">
            </div>
        </div>
    </div>

    </div>
</body>
</html>
