<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.1.1.js"></script>
<style>
    *{margin: 0;padding: 0;}
    ul li{list-style: none;}
    body{background-color: #333;}
    #wrap{
        width: 640px;
        margin: 100px auto 0;
    }
    #nav li{float: left;}
    #nav li a{
        display: block;
        border: 2px solid #bbb;
        margin: 0 6px 10px 0;
        border-radius: 5px;
    }
    #nav li a img{width: 70px;}
    #window{clear: both;}
    #nav li a.active{
        border: 2px solid #fff;
    }


</style>

</head>
<body>
    <div id="wrap">
        <ul id="nav">
            <li><a href="images/lop0.jpg" class="active"><img src="images/thumb0.jpg" alt="호1"></a></li>
            <li><a href="images/lop1.jpg"><img src="images/thumb1.jpg" alt="호2"></a></li>
            <li><a href="images/lop2.jpg"><img src="images/thumb2.jpg" alt="호3"></a></li>
            <li><a href="images/lop3.jpg"><img src="images/thumb3.jpg" alt="호4"></a></li>
            <li><a href="images/lop4.jpg"><img src="images/thumb4.jpg" alt="호5"></a></li>
            <li><a href="images/lop5.jpg"><img src="images/thumb5.jpg" alt="호6"></a></li>
            <li><a href="images/lop6.jpg"><img src="images/thumb6.jpg" alt="호7"></a></li>
            <li><a href="images/lop7.jpg"><img src="images/thumb7.jpg" alt="호8"></a></li>
        </ul>
        <div id="window"><img src="images/lop0.jpg" alt=""></div>
    </div>
    
</body>
</html>

    $(function(){
        $("#nav li a").click(function(){
            var img_url = $(this).attr('href');//현재 href 들어있는 속성값을 읽어서 img_url 저장
            //alert(img_url);
            $('#window img').attr('src', img_url);
            $("#nav li a").removeClass('active');
            $(this).addClass('active');

            return false;
        });
    });


</script>
